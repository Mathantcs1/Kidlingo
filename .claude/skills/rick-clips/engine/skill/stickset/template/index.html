<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{position:absolute;left:0;top:0}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head><body>
<canvas id="gl"></canvas><canvas id="fx"></canvas>
<script type="module">
import * as THREE from 'three';
import { vnoise, seg, ss, back, eio, hash } from '/core/lib.js';
import { SETS } from './stickset/sets/index.js';
import { cameraFor } from './stickset/cams.js';
import { cctvOverlay, transitionWindow } from './stickset/transitions.js';
import { buildCaptionTrack, captionAt } from './stickset/captions.js';
import { drawStick, blend, POSES, FACES } from './stickset/rig.js';

const TL = await (await fetch('./timeline.json')).json();
const W = innerWidth, H = innerHeight;
const gl = document.getElementById('gl'), fx = document.getElementById('fx');
for (const c of [gl, fx]) { c.width = W; c.height = H; c.style.width = W + 'px'; c.style.height = H + 'px'; }
const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.outputColorSpace = THREE.SRGBColorSpace;
const ctx = fx.getContext('2d');
const snap = Object.assign(document.createElement('canvas'), { width: W, height: H }), sctx = snap.getContext('2d');
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 60);
const scenes = {};
for (const s of TL.shots) scenes[s.set] ??= SETS[s.set](THREE).scene;
const shots = TL.shots.map(s => ({ ...s, ...cameraFor(s.cam, s.t0, s.t1) }));
const track = buildCaptionTrack(TL.words, { cuts: TL.shots.map(s => s.t0) });   // captions never cross a shot cut

const T = (...p) => new THREE.Vector3(...p);
const NEIGH = [{ x: 0, z: 0, suit: '#7fb2e5' }, { x: -1.3, z: -0.7, suit: '#e58fb0' }, { x: 1.3, z: -0.6, suit: '#9bd18b' }, { x: -0.7, z: -1.5, suit: '#c7a2e8' }, { x: 0.8, z: -1.6, suit: '#f1d36b' }];
const figures = shot => {   // baker steps back behind the counter when neighbours share the shot (no overlap)
  const both = shot.cast.includes('baker') && shot.cast.includes('neighbours');
  return shot.cast.flatMap(name =>
    name === 'baker' ? [{ x: both ? 1.7 : 0, z: both ? -2.0 : 0, suit: '#f3eee2', toque: true, i: 0 }] :
    name === 'neighbours' ? NEIGH.map((n, i) => ({ ...n, z: n.z + (both ? 1.2 : 0), x: n.x - (both ? 0.4 : 0), i, pop: shot.t0 + 0.15 + i * 0.28 })) : []).sort((a, b) => a.z - b.z);
};

const Q = new URLSearchParams(location.search), FROM = +(Q.get('from') || 0), TO = +(Q.get('to') || TL.DUR);   // chapter window
window.DUR = TO - FROM; window.READY = true;

function toScreen(p) {   // the one world → screen function
  camera.updateMatrixWorld();
  const v = p.clone().project(camera), d = -p.clone().applyMatrix4(camera.matrixWorldInverse).z;
  return { x: (v.x * .5 + .5) * W, y: (1 - (v.y * .5 + .5)) * H, s: H / (2 * d * Math.tan(camera.fov * Math.PI / 360)) };
}
function shotAtTime(t) { return shots.find(s => t >= s.t0 && t < s.t1) || shots.at(-1); }

function drawShot(c, shot, t) {   // 3D set + billboard cast for one shot at time t onto context c
  const pose = shot.cam(t);
  const dx = (vnoise(t * 1.3) - .5) * .05, dy = (vnoise(t * 1.7 + 9) - .5) * .035;   // handheld drift, deterministic
  camera.position.set(pose.pos[0] + dx, pose.pos[1] + dy, pose.pos[2]); camera.fov = pose.fov; camera.updateProjectionMatrix();
  camera.lookAt(T(...shot.at)); renderer.render(scenes[shot.set], camera);
  c.clearRect(0, 0, W, H); c.drawImage(gl, 0, 0);
  const k = ss(seg(t, shot.t0 + 0.05, shot.t0 + 0.65));
  const face = blend(FACES.flat, FACES[shot.face] || FACES.flat, k);
  for (const f of figures(shot)) {
    const p = toScreen(T(f.x, 0, f.z)), grow = f.pop === undefined ? 1 : Math.max(0.001, back(seg(t, f.pop, f.pop + 0.4)));
    const walk = Math.sin(t * 5 + f.i * 1.7);
    const pz = blend(POSES.idle, POSES.smug, shot.face === 'smug' ? k : 0);
    pz.bob = f.pop === undefined ? pz.bob : Math.abs(walk) * 0.02; pz.armL += walk * 0.08; pz.armR -= walk * 0.08;
    drawStick(c, { x: p.x, y: p.y, s: p.s * grow, pose: pz, face, jumpsuit: f.suit, toque: !!f.toque });
  }
}

const nbuf = Object.assign(document.createElement('canvas'), { width: W, height: H }), bctx = nbuf.getContext('2d');   // next-shot buffer
const camLabel = shot => `CAM 02  ${shot.set.toUpperCase()}`;

// Transitions are centred on the boundary (the first spoken word of the new shot) and chosen by the script (see core/script.js).
function composite(c, A, B, type, k) {
  c.clearRect(0, 0, W, H);
  if (type === 'fade') { c.drawImage(A, 0, 0); c.globalAlpha = ss(k); c.drawImage(B, 0, 0); c.globalAlpha = 1; }
  else if (type === 'whip') {   // slide wipe with motion blur: old shot leaves left, new shot arrives from the right
    const e = eio(k); c.filter = `blur(${Math.sin(Math.PI * k) * W * 0.025}px)`;
    c.drawImage(A, -e * W, 0); c.drawImage(B, (1 - e) * W, 0); c.filter = 'none';
  } else if (type === 'punch') {   // zoom into the old shot, flash, new shot settles from big to normal
    const second = k >= 0.5, u = second ? (k - 0.5) * 2 : k * 2, sc = second ? 1.35 - 0.35 * ss(u) : 1 + 0.35 * ss(u);
    c.filter = `blur(${(second ? 1 - u : u) * W * 0.02}px)`; c.save(); c.translate(W / 2, H / 2); c.scale(sc, sc); c.drawImage(second ? B : A, -W / 2, -H / 2); c.restore(); c.filter = 'none';
    c.fillStyle = `rgba(255,255,255,${0.35 * Math.sin(Math.PI * k)})`; c.fillRect(0, 0, W, H);
  } else if (type === 'cctv') {   // hard cut hidden in a signal glitch: torn horizontal slices + noise bars
    const src = k < 0.5 ? A : B; c.drawImage(src, 0, 0);
    for (let i = 0; i < 8; i++) {
      const y = hash(i * 7.1 + Math.floor(k * 6)) * H, hh = H * (0.02 + 0.05 * hash(i + 3)), dx = (hash(i * 3.3 + Math.floor(k * 6)) - 0.5) * W * 0.25 * Math.sin(Math.PI * k);
      c.drawImage(src, 0, y, W, hh, dx, y, W, hh);
      c.fillStyle = `rgba(255,255,255,${0.18 * Math.sin(Math.PI * k)})`; c.fillRect(0, hash(i * 1.7 + 5) * H, W, H * 0.004);
    }
  }
}

const renderAt = t => {
  const win = transitionWindow(shots, t);
  if (win) {
    const prev = shots.find(s => s.id === win.prev.id), next = shots.find(s => s.id === win.next.id);
    drawShot(sctx, prev, t); drawShot(bctx, next, t);
    composite(ctx, snap, nbuf, win.type, win.k);
    if (next.overlay === 'cctv') cctvOverlay(ctx, W, H, t, camLabel(next), ss(win.k));        // entering the camera view
    else if (prev.overlay === 'cctv') cctvOverlay(ctx, W, H, t, camLabel(prev), 1 - ss(win.k)); // leaving it: the frame fades out with the cut
  } else {
    const shot = shotAtTime(t); drawShot(ctx, shot, t);
    if (shot.overlay === 'cctv') cctvOverlay(ctx, W, H, t, camLabel(shot), 1);
  }
  const word = captionAt(track, t);
  if (word) {
    const fs = Math.round(H * 0.056);
    ctx.font = `800 ${fs}px "Liberation Sans", "DejaVu Sans", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = fs * 0.2; ctx.strokeStyle = '#000'; ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = fs * 0.25; ctx.shadowOffsetY = fs * 0.06;
    ctx.strokeText(word, W / 2, H * 0.645); ctx.shadowColor = 'transparent'; ctx.fillStyle = '#fff'; ctx.fillText(word, W / 2, H * 0.645);
  }
};
window.render = t => renderAt(t + FROM);
window.TEXTS = t => { t += FROM; const w = captionAt(track, t); return w ? [{ id: 'cap-' + w, text: w, x0: 0, y0: H * .6, x1: W, y1: H * .69, pass: true }] : []; };
</script></body></html>
