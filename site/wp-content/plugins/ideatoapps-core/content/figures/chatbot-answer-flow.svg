<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 352">
<title>How a chatbot answers</title>
<desc>Four steps: you write a message, it is split into pieces, the model predicts the next piece, and that piece is added to the answer. Steps three and four repeat until the answer is finished.</desc>
<g stroke-width="2">
<rect x="20" y="10" width="220" height="46" rx="12" fill="var(--ita-fig-3)" stroke="var(--ita-fig-3-s)"/>
<rect x="20" y="84" width="220" height="62" rx="12" fill="var(--ita-fig-1)" stroke="var(--ita-fig-1-s)"/>
<rect x="20" y="174" width="220" height="62" rx="12" fill="var(--ita-fig-2)" stroke="var(--ita-fig-2-s)"/>
<rect x="20" y="264" width="220" height="62" rx="12" fill="var(--ita-fig-4)" stroke="var(--ita-fig-4-s)"/>
<path d="M130 56L130 82" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M130 82L123.5 71L136.5 71Z" fill="var(--ita-fig-line)"/>
<path d="M130 146L130 172" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M130 172L123.5 161L136.5 161Z" fill="var(--ita-fig-line)"/>
<path d="M130 236L130 262" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M130 262L123.5 251L136.5 251Z" fill="var(--ita-fig-line)"/>
<path d="M240 295L284 295L284 205L242 205" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M242 205L253 198.5L253 211.5Z" fill="var(--ita-fig-line)"/>
</g>
<g font-size="18" text-anchor="middle" fill="var(--ita-fig-ink)">
<text x="130" y="38" font-weight="600">Your message</text>
<text x="130" y="109" font-weight="600">It is split up</text>
<text x="130" y="131">into pieces</text>
<text x="130" y="199" font-weight="600">The model predicts</text>
<text x="130" y="221">the next piece</text>
<text x="130" y="289" font-weight="600">The piece is added</text>
<text x="130" y="311">to the answer</text>
<text x="294" y="254" text-anchor="start" fill="var(--ita-fig-muted)">repeat</text>
<text x="20" y="346" text-anchor="start" fill="var(--ita-fig-muted)">Each piece is a guess.</text>
</g>
</svg>
