<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312">
<title>The agent loop</title>
<desc>A goal enters a loop of four steps: plan, act, observe and check. The check either sends the agent back to plan or ends with a result.</desc>
<g stroke-width="2">
<rect x="20" y="10" width="120" height="36" rx="18" fill="var(--ita-fig-3)" stroke="var(--ita-fig-3-s)"/>
<rect x="20" y="80" width="120" height="52" rx="12" fill="var(--ita-fig-1)" stroke="var(--ita-fig-1-s)"/>
<rect x="220" y="80" width="120" height="52" rx="12" fill="var(--ita-fig-2)" stroke="var(--ita-fig-2-s)"/>
<rect x="220" y="180" width="120" height="52" rx="12" fill="var(--ita-fig-4)" stroke="var(--ita-fig-4-s)"/>
<rect x="20" y="180" width="120" height="52" rx="12" fill="var(--ita-fig-5)" stroke="var(--ita-fig-5-s)"/>
<rect x="20" y="266" width="120" height="36" rx="18" fill="var(--ita-fig-3)" stroke="var(--ita-fig-3-s)"/>
<path d="M80 46L80 78" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M80 78L73.5 67L86.5 67Z" fill="var(--ita-fig-line)"/>
<path d="M140 106L218 106" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M218 106L207 112.5L207 99.5Z" fill="var(--ita-fig-line)"/>
<path d="M280 132L280 178" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M280 178L273.5 167L286.5 167Z" fill="var(--ita-fig-line)"/>
<path d="M220 206L142 206" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M142 206L153 199.5L153 212.5Z" fill="var(--ita-fig-line)"/>
<path d="M50 180L50 134" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M50 134L56.5 145L43.5 145Z" fill="var(--ita-fig-line)"/>
<path d="M80 232L80 264" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M80 264L73.5 253L86.5 253Z" fill="var(--ita-fig-line)"/>
</g>
<g font-size="18" text-anchor="middle" fill="var(--ita-fig-ink)">
<text x="80" y="33" font-weight="600">Goal</text>
<text x="80" y="100" font-weight="600">Plan</text>
<text x="80" y="122">next step</text>
<text x="280" y="100" font-weight="600">Act</text>
<text x="280" y="122">use a tool</text>
<text x="280" y="200" font-weight="600">Observe</text>
<text x="280" y="222">the result</text>
<text x="80" y="200" font-weight="600">Check</text>
<text x="80" y="222">done yet?</text>
<text x="80" y="289" font-weight="600">Result</text>
<text x="60" y="162" text-anchor="start" fill="var(--ita-fig-muted)">not yet</text>
<text x="90" y="254" text-anchor="start" fill="var(--ita-fig-muted)">yes</text>
<text x="186" y="290" text-anchor="start" fill="var(--ita-fig-muted)">Repeat until done</text>
</g>
</svg>
