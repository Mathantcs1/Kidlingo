<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
<title>How a language model is trained</title>
<desc>Three stages top to bottom: reading a huge amount of text to learn patterns, practicing on example conversations, and improving from human feedback.</desc>
<g stroke-width="2">
<rect x="10" y="10" width="340" height="68" rx="12" fill="var(--ita-fig-1)" stroke="var(--ita-fig-1-s)"/>
<rect x="10" y="100" width="340" height="68" rx="12" fill="var(--ita-fig-2)" stroke="var(--ita-fig-2-s)"/>
<rect x="10" y="190" width="340" height="68" rx="12" fill="var(--ita-fig-3)" stroke="var(--ita-fig-3-s)"/>
<path d="M180 78L180 98" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M180 98L173.5 87L186.5 87Z" fill="var(--ita-fig-line)"/>
<path d="M180 168L180 188" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M180 188L173.5 177L186.5 177Z" fill="var(--ita-fig-line)"/>
</g>
<g font-size="18" text-anchor="middle" fill="var(--ita-fig-ink)">
<text x="180" y="38" font-weight="600">1  Read lots of text</text>
<text x="180" y="60">learns patterns in language</text>
<text x="180" y="128" font-weight="600">2  Practice on examples</text>
<text x="180" y="150">learns to follow instructions</text>
<text x="180" y="218" font-weight="600">3  Learn from feedback</text>
<text x="180" y="240">people rate its answers</text>
<text x="180" y="288" fill="var(--ita-fig-muted)">A simplified view.</text>
</g>
</svg>
