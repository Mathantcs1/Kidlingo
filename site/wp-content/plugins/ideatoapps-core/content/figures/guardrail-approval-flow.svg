<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340">
<title>Guardrails and human approval</title>
<desc>An agent proposes an action. A risk check follows. Low-risk actions run. Risky ones wait for a person, who approves and the action runs, or declines and it stops.</desc>
<g stroke-width="2">
<rect x="80" y="10" width="200" height="52" rx="12" fill="var(--ita-fig-1)" stroke="var(--ita-fig-1-s)"/>
<path d="M180 62L180 82" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M180 82L173.5 71L186.5 71Z" fill="var(--ita-fig-line)"/>
<path d="M180 84L240 126L180 168L120 126Z" fill="var(--ita-fig-4)" stroke="var(--ita-fig-4-s)"/>
<rect x="10" y="102" width="80" height="48" rx="12" fill="var(--ita-fig-3)" stroke="var(--ita-fig-3-s)"/>
<path d="M120 126L92 126" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M92 126L103 119.5L103 132.5Z" fill="var(--ita-fig-line)"/>
<path d="M180 168L180 222" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M180 222L173.5 211L186.5 211Z" fill="var(--ita-fig-line)"/>
<rect x="110" y="224" width="140" height="56" rx="12" fill="var(--ita-fig-2)" stroke="var(--ita-fig-2-s)"/>
<path d="M110 252L50 252L50 152" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M50 152L56.5 163L43.5 163Z" fill="var(--ita-fig-line)"/>
<path d="M250 252L292 252" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M292 252L281 258.5L281 245.5Z" fill="var(--ita-fig-line)"/>
<rect x="294" y="228" width="56" height="48" rx="12" fill="var(--ita-fig-5)" stroke="var(--ita-fig-5-s)"/>
</g>
<g font-size="18" text-anchor="middle" fill="var(--ita-fig-ink)">
<text x="180" y="30" font-weight="600">Agent proposes</text>
<text x="180" y="52">an action</text>
<text x="180" y="132" font-weight="600">Risky?</text>
<text x="50" y="131">Do it</text>
<text x="106" y="118" fill="var(--ita-fig-muted)">No</text>
<text x="192" y="200" text-anchor="start" fill="var(--ita-fig-muted)">Yes</text>
<text x="180" y="246" font-weight="600">A person</text>
<text x="180" y="268">decides</text>
<text x="10" y="276" text-anchor="start" fill="var(--ita-fig-muted)">Approve</text>
<text x="272" y="242" fill="var(--ita-fig-muted)">No</text>
<text x="322" y="257">Stop</text>
<text x="180" y="328" fill="var(--ita-fig-muted)">Rules set limits. People decide.</text>
</g>
</svg>
