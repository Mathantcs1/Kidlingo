<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400">
<title>Guardrails and human approval</title>
<desc>An agent proposes an action. A risk check follows. Low-risk actions run. Risky ones wait for a person, who approves and the action runs, or declines and it stops.</desc>
<g stroke-width="2">
<rect x="130" y="10" width="220" height="48" rx="12" fill="var(--ita-fig-1)" stroke="var(--ita-fig-1-s)"/>
<path d="M240 58L240 84" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M240 84L233.5 73L246.5 73Z" fill="var(--ita-fig-line)"/>
<path d="M240 86L320 136L240 186L160 136Z" fill="var(--ita-fig-4)" stroke="var(--ita-fig-4-s)"/>
<rect x="10" y="112" width="110" height="48" rx="12" fill="var(--ita-fig-3)" stroke="var(--ita-fig-3-s)"/>
<path d="M160 136L122 136" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M122 136L133 129.5L133 142.5Z" fill="var(--ita-fig-line)"/>
<path d="M240 186L240 246" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M240 246L233.5 235L246.5 235Z" fill="var(--ita-fig-line)"/>
<rect x="150" y="248" width="180" height="56" rx="12" fill="var(--ita-fig-2)" stroke="var(--ita-fig-2-s)"/>
<path d="M150 276L65 276L65 162" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M65 162L71.5 173L58.5 173Z" fill="var(--ita-fig-line)"/>
<path d="M330 276L370 276" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M370 276L359 282.5L359 269.5Z" fill="var(--ita-fig-line)"/>
<rect x="372" y="252" width="98" height="48" rx="12" fill="var(--ita-fig-5)" stroke="var(--ita-fig-5-s)"/>
</g>
<g font-size="20" text-anchor="middle" fill="var(--ita-fig-ink)">
<text x="240" y="27" font-weight="600">Agent proposes</text>
<text x="240" y="51">an action</text>
<text x="240" y="142" font-weight="600">Risky?</text>
<text x="65" y="141">Do it</text>
<text x="141" y="126" font-size="18" fill="var(--ita-fig-muted)">No</text>
<text x="252" y="222" text-anchor="start" font-size="18" fill="var(--ita-fig-muted)">Yes</text>
<text x="240" y="269" font-weight="600">A person</text>
<text x="240" y="293">decides</text>
<text x="75" y="262" text-anchor="start" font-size="18" fill="var(--ita-fig-muted)">Approve</text>
<text x="350" y="266" font-size="18" fill="var(--ita-fig-muted)">No</text>
<text x="421" y="281">Stop</text>
<text x="240" y="380" font-size="18" fill="var(--ita-fig-muted)">Guardrails set limits. People decide.</text>
</g>
</svg>
