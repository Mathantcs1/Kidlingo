<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250">
<title>Short-term and long-term memory</title>
<desc>An agent in the middle reads from and writes to two places: short-term memory, which is the current chat, and long-term memory, which is saved notes it can look up later.</desc>
<g stroke-width="2">
<rect x="110" y="10" width="140" height="48" rx="12" fill="var(--ita-fig-1)" stroke="var(--ita-fig-1-s)"/>
<rect x="10" y="130" width="165" height="108" rx="12" fill="var(--ita-fig-2)" stroke="var(--ita-fig-2-s)"/>
<rect x="185" y="130" width="165" height="108" rx="12" fill="var(--ita-fig-3)" stroke="var(--ita-fig-3-s)"/>
<path d="M150 58L92 128" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M92 128L94 115.4L104 123.7Z" fill="var(--ita-fig-line)"/>
<path d="M150 58L148 70.6L138 62.3Z" fill="var(--ita-fig-line)"/>
<path d="M210 58L268 128" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M268 128L256 123.7L266 115.4Z" fill="var(--ita-fig-line)"/>
<path d="M210 58L222 62.3L212 70.6Z" fill="var(--ita-fig-line)"/>
</g>
<g font-size="18" text-anchor="middle" fill="var(--ita-fig-ink)">
<text x="180" y="39">Agent</text>
<text x="92.5" y="156" font-weight="600">Short-term</text>
<text x="92.5" y="178">this chat</text>
<text x="92.5" y="200">limited by the</text>
<text x="92.5" y="222">context window</text>
<text x="267.5" y="156" font-weight="600">Long-term</text>
<text x="267.5" y="178">saved notes</text>
<text x="267.5" y="200">looked up</text>
<text x="267.5" y="222">when needed</text>
</g>
</svg>
