<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290">
<title>The evaluation loop</title>
<desc>Test questions are run through the agent, the results are scored, one thing is changed, and the tests run again to see whether the score improved.</desc>
<g stroke-width="2">
<rect x="10" y="10" width="150" height="52" rx="12" fill="var(--ita-fig-3)" stroke="var(--ita-fig-3-s)"/>
<rect x="10" y="102" width="150" height="52" rx="12" fill="var(--ita-fig-1)" stroke="var(--ita-fig-1-s)"/>
<rect x="200" y="102" width="150" height="52" rx="12" fill="var(--ita-fig-2)" stroke="var(--ita-fig-2-s)"/>
<rect x="200" y="192" width="150" height="52" rx="12" fill="var(--ita-fig-4)" stroke="var(--ita-fig-4-s)"/>
<path d="M85 62L85 100" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M85 100L78.5 89L91.5 89Z" fill="var(--ita-fig-line)"/>
<path d="M160 128L198 128" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M198 128L187 134.5L187 121.5Z" fill="var(--ita-fig-line)"/>
<path d="M275 154L275 190" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M275 190L268.5 179L281.5 179Z" fill="var(--ita-fig-line)"/>
<path d="M200 218L85 218L85 156" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M85 156L91.5 167L78.5 167Z" fill="var(--ita-fig-line)"/>
</g>
<g font-size="18" text-anchor="middle" fill="var(--ita-fig-ink)">
<text x="85" y="30" font-weight="600">Test set</text>
<text x="85" y="52">questions</text>
<text x="85" y="122" font-weight="600">Run agent</text>
<text x="85" y="144">answers</text>
<text x="275" y="122" font-weight="600">Score</text>
<text x="275" y="144">grade them</text>
<text x="275" y="212" font-weight="600">Change</text>
<text x="275" y="234">one thing</text>
<text x="98" y="208" text-anchor="start" fill="var(--ita-fig-muted)">run again</text>
<text x="180" y="278" fill="var(--ita-fig-muted)">Change one thing at a time.</text>
</g>
</svg>
