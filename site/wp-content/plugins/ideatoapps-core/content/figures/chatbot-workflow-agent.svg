<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322">
<title>Chatbot, workflow and agent</title>
<desc>Three rows. A chatbot answers one question. A workflow follows fixed steps set by a person. An agent decides its own next steps and repeats until the goal is met.</desc>
<g stroke-width="2">
<rect x="10" y="36" width="100" height="42" rx="12" fill="var(--ita-fig-1)" stroke="var(--ita-fig-1-s)"/>
<rect x="150" y="36" width="100" height="42" rx="12" fill="var(--ita-fig-2)" stroke="var(--ita-fig-2-s)"/>
<path d="M110 57L148 57" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M148 57L137 63.5L137 50.5Z" fill="var(--ita-fig-line)"/>
<rect x="10" y="132" width="96" height="42" rx="12" fill="var(--ita-fig-3)" stroke="var(--ita-fig-3-s)"/>
<rect x="132" y="132" width="96" height="42" rx="12" fill="var(--ita-fig-3)" stroke="var(--ita-fig-3-s)"/>
<rect x="254" y="132" width="96" height="42" rx="12" fill="var(--ita-fig-3)" stroke="var(--ita-fig-3-s)"/>
<path d="M106 153L130 153" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M130 153L119 159.5L119 146.5Z" fill="var(--ita-fig-line)"/>
<path d="M228 153L252 153" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M252 153L241 159.5L241 146.5Z" fill="var(--ita-fig-line)"/>
<rect x="10" y="228" width="84" height="42" rx="12" fill="var(--ita-fig-4)" stroke="var(--ita-fig-4-s)"/>
<rect x="118" y="228" width="84" height="42" rx="12" fill="var(--ita-fig-5)" stroke="var(--ita-fig-5-s)"/>
<rect x="258" y="228" width="84" height="42" rx="12" fill="var(--ita-fig-2)" stroke="var(--ita-fig-2-s)"/>
<path d="M94 249L116 249" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M116 249L105 255.5L105 242.5Z" fill="var(--ita-fig-line)"/>
<path d="M202 240L256 240" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M256 240L245 246.5L245 233.5Z" fill="var(--ita-fig-line)"/>
<path d="M256 260L204 260" fill="none" stroke="var(--ita-fig-line)" stroke-width="3"/>
<path d="M204 260L215 253.5L215 266.5Z" fill="var(--ita-fig-line)"/>
</g>
<g font-size="18" text-anchor="middle" fill="var(--ita-fig-ink)">
<text x="10" y="26" text-anchor="start" font-weight="600">Chatbot: you ask, it answers</text>
<text x="60" y="62">Ask</text>
<text x="200" y="62">Answer</text>
<text x="10" y="122" text-anchor="start" font-weight="600">Workflow: fixed steps</text>
<text x="58" y="158">Step 1</text>
<text x="180" y="158">Step 2</text>
<text x="302" y="158">Step 3</text>
<text x="10" y="218" text-anchor="start" font-weight="600">Agent: picks its own steps</text>
<text x="52" y="254">Goal</text>
<text x="160" y="254">Plan</text>
<text x="300" y="254">Act</text>
<text x="180" y="308" fill="var(--ita-fig-muted)">More freedom needs more checks.</text>
</g>
</svg>
