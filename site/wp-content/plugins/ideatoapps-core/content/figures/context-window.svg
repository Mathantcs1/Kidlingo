<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 252">
<title>A context window filling up</title>
<desc>Two bars show the space a model can read at once. Early in a chat the bar is mostly empty. In a long chat it is full: the app rules stay, and the oldest messages are cut off.</desc>
<g stroke-width="2">
<rect x="10" y="38" width="68" height="46" rx="6" fill="var(--ita-fig-1)" stroke="var(--ita-fig-1-s)"/>
<rect x="78" y="38" width="74" height="46" rx="6" fill="var(--ita-fig-2)" stroke="var(--ita-fig-2-s)"/>
<rect x="152" y="38" width="80" height="46" rx="6" fill="var(--ita-fig-3)" stroke="var(--ita-fig-3-s)"/>
<rect x="232" y="38" width="118" height="46" rx="6" fill="none" stroke="var(--ita-fig-5-s)" stroke-dasharray="6 5"/>
<rect x="10" y="138" width="68" height="46" rx="6" fill="var(--ita-fig-1)" stroke="var(--ita-fig-1-s)"/>
<rect x="78" y="138" width="100" height="46" rx="6" fill="none" stroke="var(--ita-fig-5-s)" stroke-dasharray="6 5"/>
<rect x="178" y="138" width="64" height="46" rx="6" fill="var(--ita-fig-2)" stroke="var(--ita-fig-2-s)"/>
<rect x="242" y="138" width="108" height="46" rx="6" fill="var(--ita-fig-3)" stroke="var(--ita-fig-3-s)"/>
</g>
<g font-size="18" text-anchor="middle" fill="var(--ita-fig-ink)">
<text x="10" y="26" text-anchor="start" font-weight="600">Early in a chat</text>
<text x="44" y="66">Rules</text>
<text x="115" y="66">You</text>
<text x="192" y="66">Reply</text>
<text x="10" y="126" text-anchor="start" font-weight="600">Late in a long chat</text>
<text x="44" y="166">Rules</text>
<text x="128" y="166">Cut off</text>
<text x="210" y="166">You</text>
<text x="296" y="166">Reply</text>
<text x="10" y="218" text-anchor="start" fill="var(--ita-fig-muted)">The oldest messages fall out first.</text>
<text x="10" y="242" text-anchor="start" fill="var(--ita-fig-muted)">Dashed: empty or dropped text.</text>
</g>
</svg>
